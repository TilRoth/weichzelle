[package]
name = "weichzelle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
keyring = { version = "3.6.3", features = ["crypto-rust", "linux-native-sync-persistent"] }
libdbus-sys = { version = "0.2.7", features = ["vendored"] }
microsandbox = { version = "=0.7.8", default-features = false, features = ["local", "net"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "process", "fs", "io-std"] }
toml = "1.1.8"
